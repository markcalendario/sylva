<!doctype html>
<!--
  Starts in the default theme rather than in the stylesheet's bare :root, so
  the first paint is already the one most people will be looking at. main.tsx
  reads the stored preference a moment later and takes the attribute back off
  if that preference is the forest.
-->
<html lang="en" data-theme="professional">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sylva</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
